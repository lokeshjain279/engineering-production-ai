<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Workload-aware inference routing</title><desc id="d">An API feeds admission control and a request queue. A scheduler dispatches work to GPU worker pools based on capacity and health, with metrics fed back to the scheduler.</desc><rect width="960" height="420" rx="20" fill="#f0f6fa"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#18364e" font-size="18"><rect x="32" y="155" width="152" height="76" rx="12" fill="#fff" stroke="#91b6c7"/><text x="108" y="188">API and</text><text x="108" y="211">validation</text><rect x="225" y="155" width="170" height="76" rx="12" fill="#fff" stroke="#91b6c7"/><text x="310" y="188">Admission</text><text x="310" y="211">control</text><rect x="438" y="155" width="170" height="76" rx="12" fill="#fff" stroke="#91b6c7"/><text x="523" y="188">Queue +</text><text x="523" y="211">scheduler</text><rect x="682" y="52" width="232" height="80" rx="12" fill="#d5ebf1" stroke="#458aa4"/><text x="798" y="86">GPU pool A</text><text x="798" y="110" font-size="14">low queue depth</text><rect x="682" y="160" width="232" height="80" rx="12" fill="#d5ebf1" stroke="#458aa4"/><text x="798" y="194">GPU pool B</text><text x="798" y="218" font-size="14">busy / warm</text><rect x="682" y="268" width="232" height="80" rx="12" fill="#d5ebf1" stroke="#458aa4"/><text x="798" y="302">GPU pool C</text><text x="798" y="326" font-size="14">unhealthy / excluded</text><rect x="235" y="315" width="350" height="62" rx="12" fill="#17364d"/><text x="410" y="342" fill="#fff">Metrics and worker health</text><text x="410" y="362" fill="#cce3ee" font-size="14">queue, latency, memory, readiness</text></g><g stroke="#377f9d" stroke-width="3" fill="none"><path d="M184 193h41m170 0h43m170 0h35v-101h39m-74 101h74m-74 0h35v115h39M798 348v43H523v-14M410 315v-66"/></g><g fill="#377f9d"><path d="M216 187l9 6-9 6m204-12l9 6-9 6m244-101l9 6-9 6m-9 95l9 6-9 6m-9 109l9 6-9 