<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="t d"><title id="t">Dynamic batching throughput and waiting time</title><desc id="d">Requests arrive over time. A batch flushes either when the batch size limit is reached or when the maximum wait timer expires.</desc><rect width="960" height="390" rx="20" fill="#f0f6fa"/><g font-family="Arial,sans-serif" fill="#1b3c53"><text x="42" y="55" font-size="24" font-weight="bold">Two reasons to flush a batch</text><text x="42" y="105" font-size="18">A. Size limit reached</text><text x="42" y="245" font-size="18">B. Wait deadline reached</text></g><g stroke="#8bb4c7" stroke-width="2"><path d="M42 182h876M42 325h876"/></g><g fill="#d1eaf1" stroke="#408aa8" stroke-width="2"><rect x="100" y="127" width="85" height="46" rx="8"/><rect x="205" y="127" width="85" height="46" rx="8"/><rect x="310" y="127" width="85" height="46" rx="8"/><rect x="415" y="127" width="85" height="46" rx="8"/><rect x="100" y="270" width="85" height="46" rx="8"/><rect x="205" y="270" width="85" height="46" rx="8"/></g><g fill="#16364e" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><text x="142" y="155">R1</text><text x="247" y="155">R2</text><text x="352" y="155">R3</text><text x="457" y="155">R4</text><text x="142" y="298">R1</text><text x="247" y="298">R2</text></g><g stroke="#247f9e" stroke-width="3" stroke-dasharray="6 5"><path d="M530 115v77M530 260v77"/></g><g fill="#17364d" font-family="Arial,sans-serif" font-size="17"><text x="550" y="150">Flush: max batch size = 4</text><text x="550" y="293">Flush: max wait = 10 ms</text></g><text x="42" y="365" font-family="Arial,sans-serif" font-size="14" fill="#5a7487">Illustrative request timelines — not benchmark measurements</text></svg>