<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc"><title id="title">Scalable inference pipeline architecture</title><desc id="desc">Clients pass through ingestion, a bounded queue, a scheduler, CPU preprocessing, GPU model workers, and result storage. Observability covers every stage.</desc><rect width="960" height="360" rx="16" fill="#f0f6fa"/><g font-family="Arial,sans-serif" text-anchor="middle" font-size="17" font-weight="bold" fill="#17324b"><rect x="25" y="95" width="135" height="74" rx="10" fill="#fff" stroke="#9cbaca"/><text x="92" y="139">Clients</text><rect x="190" y="95" width="135" height="74" rx="10" fill="#fff" stroke="#9cbaca"/><text x="257" y="139">Ingestion</text><rect x="355" y="95" width="135" height="74" rx="10" fill="#fff" stroke="#9cbaca"/><text x="422" y="129">Bounded</text><text x="422" y="150">queue</text><rect x="520" y="95" width="135" height="74" rx="10" fill="#fff" stroke="#9cbaca"/><text x="587" y="139">Scheduler</text><rect x="685" y="95" width="125" height="74" rx="10" fill="#fff" stroke="#9cbaca"/><text x="747" y="128">CPU</text><text x="747" y="149">preprocess</text><rect x="825" y="95" width="110" height="74" rx="10" fill="#d3edf2" stroke="#2c7894"/><text x="880" y="128">GPU</text><text x="880" y="149">workers</text></g><g stroke="#2b7290" stroke-width="3" fill="none"><path d="M160 132h30m135 0h30m135 0h30m135 0h30m125 0h15"/><path d="M181 126l9 6-9 6m165-12l9 6-9 6m165-12l9 6-9 6m165-12l9 6-9 6m131-12l9 6-9 6"/></g><path d="M880 170v50H422v30" fill="none" stroke="#2b7290" stroke-width="3"/><rect x="305" y="250" width="235" height="54" rx="10" fill="#fff" stroke="#9cbaca"/><text x="422" y="282" fill="#17324b" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="17">Results / response</text><rect x="180" y="20" width="600" height="44" rx="10" fill="#17324b"/><text x="480" y="48" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Observability · tracing · metrics · alerts</text></svg>