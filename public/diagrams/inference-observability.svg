<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t d"><title id="t">End-to-end inference latency breakdown</title><desc id="d">End-to-end latency consists of admission, queue wait, preprocessing, model execution, and postprocessing. A single trace connects all stages.</desc><rect width="960" height="300" rx="20" fill="#f0f6fa"/><text x="40" y="55" fill="#17364d" font-family="Arial,sans-serif" font-size="23" font-weight="bold">Follow the request, not just the GPU</text><g font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><rect x="40" y="100" width="120" height="70" rx="9" fill="#dbe7ef"/><text x="100" y="140" fill="#17364d">Admission</text><rect x="168" y="100" width="165" height="70" rx="9" fill="#bcd9e6"/><text x="250" y="140" fill="#17364d">Queue wait</text><rect x="341" y="100" width="165" height="70" rx="9" fill="#a8d5e2"/><text x="423" y="140" fill="#17364d">Preprocess</text><rect x="514" y="100" width="245" height="70" rx="9" fill="#4b91ae"/><text x="636" y="140" fill="#fff">Model execution</text><rect x="767" y="100" width="153" height="70" rx="9" fill="#c9e1e9"/><text x="843" y="140" fill="#17364d">Postprocess</text></g><path d="M40 203h880" stroke="#347e9b" stroke-width="3"/><path d="M40 194v18m880-18v18" stroke="#347e9b" stroke-width="3"/><text x="480" y="236" text-anchor="middle" fill="#17364d" font-family="Arial,sans-serif" font-size="18">One request ID · one end-to-end trace</text><text x="480" y="267" text-anchor="middle" fill="#5c7587" font-family="Arial,sans-serif" font-size="14">Segment widths are illustrative, not measured durations</text></svg>